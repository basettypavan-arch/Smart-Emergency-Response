<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Emergency Response Login</title>
    <meta
      name="description"
      content="Secure login for the emergency response control center."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell" id="loginShell">
      <div class="login-panel">
        <div class="illustration-card">
          <div class="orb orb-one"></div>
          <div class="orb orb-two"></div>
          <div class="illustration-glow"></div>
          <svg class="cartoon-figure" viewBox="0 0 320 320" role="img" aria-label="Secure access illustration">
            <circle cx="160" cy="110" r="54" fill="#fbbf24" />
            <path d="M92 222c10-56 54-84 68-84s58 28 68 84" fill="#2563eb" />
            <rect x="116" y="140" width="88" height="94" rx="24" fill="#111827" />
            <rect x="92" y="170" width="42" height="18" rx="9" fill="#0f766e" />
            <rect x="186" y="170" width="42" height="18" rx="9" fill="#0f766e" />
            <rect x="96" y="220" width="128" height="48" rx="18" fill="#f59e0b" />
            <rect x="124" y="120" width="18" height="18" rx="9" fill="#111827" />
            <rect x="178" y="120" width="18" height="18" rx="9" fill="#111827" />
            <circle cx="132" cy="112" r="3" fill="#ffffff" />
            <circle cx="186" cy="112" r="3" fill="#ffffff" />
            <path d="M128 140c16 14 38 14 54 0" stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round" />
            <path d="M102 164c22-18 58-28 96-12" stroke="#fbbf24" stroke-width="8" fill="none" stroke-linecap="round" />
            <path d="M98 95c8-36 38-58 62-58s54 22 62 58" stroke="#111827" stroke-width="10" fill="none" stroke-linecap="round" />
            <path d="M122 86c8 24 30 38 58 38" stroke="#111827" stroke-width="8" fill="none" stroke-linecap="round" />
            <circle cx="210" cy="126" r="12" fill="#f59e0b" />
            <path d="M222 132l20 18" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
            <path d="M98 242l-24 28" stroke="#0f766e" stroke-width="10" stroke-linecap="round" />
            <path d="M222 242l24 28" stroke="#0f766e" stroke-width="10" stroke-linecap="round" />
          </svg>
          <div class="status-pill">🚨 Secure access</div>
        </div>

        <div class="login-card">
          <h1>Secure Control Center</h1>
          <p class="login-subtitle">Sign in to access the private emergency dashboard.</p>

          <form id="adminLoginForm" class="login-form">
            <label>
              Username
              <input id="adminUsername" name="username" type="text" placeholder="Enter username" required />
            </label>
            <label class="password-field">
              Password
              <input id="adminPassword" name="password" type="password" placeholder="Enter password" required />
              <button id="togglePassword" class="toggle-password" type="button">Show</button>
            </label>
            <div class="login-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" />
                <span>Keep me signed in</span>
              </label>
            </div>
            <button class="btn btn-primary full-width" type="submit">Sign In</button>
            <p id="loginMessage" class="login-message">Welcome back.</p>
            <p class="account-link">
              Need an account?
              <a href="signup.html">Create account</a>
            </p>
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
